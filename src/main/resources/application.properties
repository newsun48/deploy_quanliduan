# 1. Cấu hình Server
server.port=${PORT:8080}

# 2. Kết nối MongoDB
# Định dạng: mongodb://[host]:[port]/[database_name]
# Multi-document transaction cho luồng downgrade manager yêu cầu Mongo replica set hoặc sharded cluster.
# Với môi trường local, hãy thêm replicaSet vào URI nếu muốn transaction thực thi đầy đủ.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/project_management_db}
spring.data.mongodb.database=project_management_db
spring.data.mongodb.auto-index-creation=false

# 3. Cấu hình hiển thị log (để dễ debug)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# 4. Cấu hình Email / JWT
spring.jackson.serialization.write-dates-as-timestamps=false
app.email.from=${EMAIL_FROM:}
app.email.reply-to=${EMAIL_REPLY_TO:}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.base-url=${RESEND_API_BASE_URL:https://api.resend.com}
app.email.resend.connect-timeout-ms=${RESEND_CONNECT_TIMEOUT_MS:5000}
app.email.resend.read-timeout-ms=${RESEND_READ_TIMEOUT_MS:10000}
app.jwt.secret=${JWT_SECRET:bdbe601c06a64e860ce2d7918a63d1458f51d19974fef012e9c94005ced872c4}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.google.client-id=${GOOGLE_WEB_CLIENT_ID:}

# 5. File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.max-file-size-bytes=${APP_UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
app.upload.max-total-size-bytes=${APP_UPLOAD_MAX_TOTAL_SIZE_BYTES:104857600}
app.avatar.max-download-bytes=${APP_AVATAR_MAX_DOWNLOAD_BYTES:5242880}
app.avatar.connect-timeout-ms=${APP_AVATAR_CONNECT_TIMEOUT_MS:5000}
app.avatar.read-timeout-ms=${APP_AVATAR_READ_TIMEOUT_MS:5000}
app.avatar.max-redirects=${APP_AVATAR_MAX_REDIRECTS:3}
