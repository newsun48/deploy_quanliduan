# 1. Cấu hình Server
server.port=${PORT:8080}

# 2. Kết nối MongoDB
# Định dạng: mongodb://[host]:[port]/[database_name]
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# 3. Cấu hình hiển thị log (để dễ debug)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# 4. Cấu hình Mail (Điền sau, giữ chỗ trước)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.password-reset.frontend-url=${FRONTEND_URL}/reset-password
app.password-reset.token-ttl-minutes=30

# 5. File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
